<!doctype html>
<html lang="en" data-theme="dusk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#15100D" />
    <meta
      name="description"
      content="Piano covers and practice tapes — film scores, Bollywood and pop, rearranged for solo piano."
    />
    <title>Shikhar Kumar — Piano</title>
    <link rel="canonical" href="https://music.shikharkumar.in/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://music.shikharkumar.in/" />
    <meta property="og:title" content="Shikhar Kumar — Piano" />
    <meta
      property="og:description"
      content="Piano covers and practice tapes. The site is being built — check back soon."
    />
    <meta name="twitter:card" content="summary" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        const t = localStorage.getItem('theme')
        if (t) document.documentElement.dataset.theme = t
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
